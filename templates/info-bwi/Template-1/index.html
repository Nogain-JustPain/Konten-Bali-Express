<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template Info BWI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --be-red: #C0181A;
    --be-red-dark: #9E1214;
    --ink: #15141A;
    --ink-soft: #4A4854;
    --paper: #FAFAF8;
    --line: #E5E2DC;
    --panel: #FFFFFF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  .app {
    display: grid;
    grid-template-columns: 380px 1fr;
    min-height: 100vh;
  }

  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 28px 26px 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--ink);
  }

  .brand-mark { width: 10px; height: 28px; background: var(--be-red); flex-shrink: 0; }

  .brand-row h1 { font-size: 17px; font-weight: 800; letter-spacing: 0.01em; margin: 0; line-height: 1.2; }

  .brand-row span {
    display: block; font-size: 11px; font-weight: 600; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px;
  }

  .field { display: flex; flex-direction: column; gap: 8px; }

  .field label {
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-soft);
  }

  textarea {
    width: 100%; border: 1.5px solid var(--line); border-radius: 6px;
    padding: 12px 13px; font-size: 15px; font-family: inherit; color: var(--ink);
    background: var(--paper); resize: vertical; min-height: 84px; line-height: 1.4;
    transition: border-color 0.15s ease;
  }

  textarea:focus { outline: none; border-color: var(--be-red); }

  .char-count { font-size: 11px; color: var(--ink-soft); text-align: right; }
  .char-count.warn { color: var(--be-red); font-weight: 700; }

  .dropzone {
    border: 2px dashed var(--line); border-radius: 8px; padding: 22px 16px;
    text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s;
    position: relative;
  }

  .dropzone:hover, .dropzone.dragover { border-color: var(--be-red); background: #FFF5F3; }
  .dropzone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .dropzone-icon { font-size: 26px; margin-bottom: 6px; opacity: 0.5; }
  .dropzone-text { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
  .dropzone-text b { color: var(--be-red); }
  .dropzone-sub { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }

  .dropzone.has-image .dropzone-icon,
  .dropzone.has-image .dropzone-text,
  .dropzone.has-image .dropzone-sub { display: none; }

  .preview-thumb { display: none; width: 100%; border-radius: 6px; overflow: hidden; }
  .dropzone.has-image .preview-thumb { display: block; }
  .preview-thumb img { width: 100%; height: 90px; object-fit: cover; display: block; }

  .remove-img {
    display: none; margin-top: 8px; font-size: 12px; font-weight: 700;
    color: var(--be-red); background: none; border: none; cursor: pointer;
    text-decoration: underline; padding: 0;
  }
  .dropzone.has-image + .remove-img { display: inline-block; }

  .download-btn {
    margin-top: 6px; width: 100%; padding: 15px; background: var(--ink);
    color: #fff; border: none; border-radius: 7px; font-size: 15px; font-weight: 800;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .download-btn:hover { background: var(--be-red-dark); }
  .download-btn:active { transform: scale(0.98); }
  .download-btn:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }

  .status-msg { font-size: 12px; color: var(--ink-soft); text-align: center; min-height: 16px; }
  .status-msg.error { color: var(--be-red); font-weight: 600; }
  .status-msg.success { color: #1a7a3c; font-weight: 600; }

  .support-btn {
    margin-top: 4px; width: 100%; padding: 11px; background: transparent;
    color: var(--ink-soft); border: 1.5px dashed var(--line); border-radius: 7px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .support-btn:hover { border-color: var(--be-red); color: var(--be-red-dark); background: #FFF5F3; }

  .editor-toolbar { display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 10px; box-shadow:0 4px 16px rgba(0,0,0,.06); }
  .tool-btn { width:38px; height:38px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:9px; border:none; background:transparent; color:var(--ink); cursor:pointer; transition:all .15s; }
  .tool-btn svg { width:19px; height:19px; }
  .tool-btn:hover:not(:disabled) { background:#F2F1EC; }
  .tool-btn.active { background:var(--ink); color:#fff; }
  .tool-btn:disabled { opacity:.35; cursor:not-allowed; }
  .tool-sep { width:1px; height:24px; background:var(--line); margin:0 2px; flex-shrink:0; }
  .tool-slider { display:flex; align-items:center; gap:8px; padding:0 6px; }
  .tool-slider svg { width:15px; height:15px; color:var(--ink-soft); flex-shrink:0; }
  .tool-slider input[type="range"] { width:90px; accent-color:var(--be-red); }
  @media(max-width:900px){ .editor-toolbar{ padding:7px 8px; } .tool-slider input[type="range"]{ width:70px; } }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(21,20,26,0.55);
    align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal-box {
    background: var(--panel); border-radius: 14px; padding: 28px 26px;
    max-width: 340px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3); position: relative;
  }
  .modal-close { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 18px; color: var(--ink-soft); cursor: pointer; line-height: 1; padding: 4px; }
  .modal-close:hover { color: var(--ink); }
  .modal-icon { font-size: 30px; margin-bottom: 10px; }
  .modal-box h3 { margin: 0 0 6px; font-size: 16px; font-weight: 800; }
  .modal-box p { margin: 0 0 18px; font-size: 13px; color: var(--ink-soft); line-height: 1.4; }

  .bank-card { background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 16px; text-align: left; }
  .bank-card .bank-name { font-size: 12px; font-weight: 700; color: var(--be-red); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .bank-card .bank-number { font-size: 19px; font-weight: 800; letter-spacing: 0.02em; margin-bottom: 4px; font-family: 'SF Mono', Consolas, monospace; }
  .bank-card .bank-owner { font-size: 13px; color: var(--ink-soft); font-weight: 600; }

  .copy-btn { margin-top: 14px; width: 100%; padding: 11px; background: var(--ink); color: #fff; border: none; border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.15s; }
  .copy-btn:hover { background: var(--be-red-dark); }
  .copy-btn.copied { background: #1a7a3c; }

  .preview-area {
    background: #EFEDE7; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 28px; padding: 40px; overflow: auto;
  }

  .canvas-wrap {
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    border-radius: 4px;
    overflow: visible !important;
    max-width: 100%;
    position: relative;
  }

  #canvas { display: block; width: 360px; height: 450px; background: #DDD; border-radius: 4px; touch-action: none; }

  /* Photo overlay - sits on top of canvas, represents photo bounds */
  #photoOverlay {
    position: absolute;
    border: 2px dashed rgba(255,255,255,0.7);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.3);
    cursor: grab;
    pointer-events: all;
    box-sizing: border-box;
    border-radius: 2px;
  }

  #photoOverlay:active { cursor: grabbing; }

  .resize-handle {
    position: absolute;
    width: 14px;
    height: 14px;
    background: #fff;
    border: 2px solid #E8412C;
    border-radius: 3px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    pointer-events: all;
  }

  #hNW { top: -7px; left: -7px; cursor: nw-resize; }
  #hNE { top: -7px; right: -7px; cursor: ne-resize; }
  #hSW { bottom: -7px; left: -7px; cursor: sw-resize; }
  #hSE { bottom: -7px; right: -7px; cursor: se-resize; }

  #resetPhotoBtn {
    position: absolute;
    top: -36px;
    right: 0;
    padding: 5px 10px;
    background: rgba(21,20,26,0.85);
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
    pointer-events: all;
  }

  #resetPhotoBtn:hover { background: #E8412C; }

  @media (max-width: 900px) {
    .preview-area { padding: 24px 16px; }
    #canvas { width: 300px; height: 375px; }
  }
</style>
</head>

<div class="app">
  <div class="panel">
    <div class="brand-row">
      <div class="brand-mark"></div>
      <div>
        <h1>Template Info BWI</h1>
        <span>Info Bwi — Highlight</span>
      </div>
    </div>

    <div class="field">
      <label for="headline">Judul Headline</label>
      <textarea id="headline" placeholder="Tulis judul berita di sini..." maxlength="160"></textarea>
      <div class="char-count" id="charCount">0 / 160</div>
    </div>

    <div class="field">
      <label>Foto Headline</label>
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp">
        <div class="dropzone-icon">📷</div>
        <div class="dropzone-text"><b>Klik untuk upload</b> atau drag foto</div>
        <div class="dropzone-sub">JPG, PNG, atau WEBP</div>
        <div class="preview-thumb" id="previewThumb"></div>
      </div>
      <button class="remove-img" id="removeImg">Hapus foto</button>
    </div>

    <div class="field">
      <label>Gradien Putih Manual</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="extraGradientToggle" style="width:17px; height:17px; accent-color: var(--be-red); cursor:pointer;">
        <label for="extraGradientToggle" style="font-size:13px; font-weight:600; color: var(--ink); text-transform:none; letter-spacing:0; cursor:pointer;">Tambahkan gradien putih ekstra</label>
      </div>
      <input type="range" id="gradientIntensity" min="0" max="100" value="0" style="width:100%; accent-color: var(--be-red);" disabled>
      <div class="char-count" id="gradientIntensityLabel">Jangkauan: 0%</div>
    </div>

    <button class="download-btn" id="downloadBtn" disabled>⬇ Download JPG</button>
    <div class="status-msg" id="statusMsg">Upload foto dulu buat mulai</div>
    <button class="support-btn" id="supportBtn">☕ Kirim Uang Kopi</button>
  </div>

  <div class="preview-area">
    <div class="editor-toolbar" id="editorToolbar">
      <button type="button" class="tool-btn" id="mosaicToggleBtn" title="Brush mosaic" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg>
      </button>
      <div class="tool-sep"></div>
      <div class="tool-slider">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>
        <input type="range" id="brushSize" min="12" max="130" value="45">
      </div>
      <div class="tool-sep"></div>
      <button type="button" class="tool-btn" id="mosaicUndoBtn" title="Undo oles terakhir" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-6.7L3 9"/></svg>
      </button>
      <button type="button" class="tool-btn" id="mosaicClearBtn" title="Hapus semua mosaic" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      </button>
    </div>
    <div class="canvas-wrap">
      <canvas id="canvas" width="1080" height="1350"></canvas>
      <div id="photoOverlay" style="display:none;">
        <div class="resize-handle" id="hNW"></div>
        <div class="resize-handle" id="hNE"></div>
        <div class="resize-handle" id="hSW"></div>
        <div class="resize-handle" id="hSE"></div>
      </div>
      <button id="resetPhotoBtn" style="display:none;">↺ Reset Foto</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="supportModal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-icon">☕</div>
    <h3>Support Developer</h3>
    <p>Kalau tools ini membantu kerjaan lu, boleh banget traktir kopi buat developernya 🙏</p>
    <div class="bank-card">
      <div class="bank-name">BCA</div>
      <div class="bank-number" id="bankNumber">1800994850</div>
      <div class="bank-owner">a.n. MOCH IQBAL KURNIAWAN</div>
    </div>
    <button class="copy-btn" id="copyBtn">Copy Nomor Rekening</button>
  </div>
</div>

// ===== HELPERS =====
function wrapText(context, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let current = '';
  for (const word of words) {
    const test = current ? current + ' ' + word : word;
    if (context.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  }
  if (current) lines.push(current);
  return lines;
}

function drawImageCover(context, img, x, y, w, h) {
  const imgRatio = img.width / img.height;
  const boxRatio = w / h;
  let sx, sy, sw, sh;
  if (imgRatio > boxRatio) {
    sh = img.height;
    sw = sh * boxRatio;
    sx = (img.width - sw) / 2;
    sy = 0;
  } else {
    sw = img.width;
    sh = sw / boxRatio;
    sx = 0;
    sy = (img.height - sh) / 2;
  }
  context.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

// ===== PHOTO TRANSFORM STATE =====
let photoTransform = { x: 0, y: 0, scale: 1 };

function resetPhotoTransform() {
  photoTransform = { x: 0, y: 0, scale: 1 };
  mosaicLayerDirty = true;
  updatePhotoOverlay();
  render();
}

function drawImageWithTransform(context, img, canvasW, canvasH) {
  // Base: cover mode dimensions
  const imgRatio = img.width / img.height;
  const boxRatio = canvasW / canvasH;
  let baseW, baseH;
  if (imgRatio > boxRatio) {
    baseH = canvasH;
    baseW = baseH * imgRatio;
  } else {
    baseW = canvasW;
    baseH = baseW / imgRatio;
  }

  // Apply scale
  const drawW = baseW * photoTransform.scale;
  const drawH = baseH * photoTransform.scale;

  // Center by default, then apply offset
  const drawX = (canvasW - drawW) / 2 + photoTransform.x;
  const drawY = (canvasH - drawH) / 2 + photoTransform.y;

  context.save();
  context.beginPath();
  context.rect(0, 0, canvasW, canvasH);
  context.clip();
  context.drawImage(img, drawX, drawY, drawW, drawH);
  context.restore();
  return { drawX, drawY, drawW, drawH };
}

// ===== MOSAIC BRUSH =====
// maskCanvas: white = "show mosaic here", transparent = "show original photo".
// Painted in the same 1080x1350 coordinate space as the main canvas, so it
// lines up with the photo as long as the photo isn't moved/resized afterward.
const MOSAIC_BLOCK = 22; // size (in canvas px) of each mosaic square
let maskCanvas = null, maskCtx = null;
let mosaicLayerCanvas = null, mosaicLayerDirty = true;
let compositeCanvas = null, compositeCtx = null;
let mosaicMode = false;
let isPainting = false, lastPaintPt = null;
let brushRadius = parseInt(brushSizeInput.value, 10);
let undoStack = [];

function ensureMosaicCanvases() {
  if (!maskCanvas) {
    maskCanvas = document.createElement('canvas');
    maskCanvas.width = CANVAS_W; maskCanvas.height = CANVAS_H;
    maskCtx = maskCanvas.getContext('2d');
  }
  if (!compositeCanvas) {
    compositeCanvas = document.createElement('canvas');
    compositeCanvas.width = CANVAS_W; compositeCanvas.height = CANVAS_H;
    compositeCtx = compositeCanvas.getContext('2d');
  }
}

function clearMosaicMask() {
  ensureMosaicCanvases();
  maskCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  undoStack = [];
  updateMosaicButtons();
}

// Rebuilds the pixelated version of the current photo (full canvas-space).
// Only needs to run when the photo/transform changes, not on every brush
// stroke, so it's cached and marked dirty explicitly. Mirrors the cover-mode
// math in drawImageWithTransform() above since this template's photo covers
// the whole canvas (no separate photoRect sub-area).
function rebuildMosaicLayer() {
  ensureMosaicCanvases();
  if (!mosaicLayerCanvas) {
    mosaicLayerCanvas = document.createElement('canvas');
    mosaicLayerCanvas.width = CANVAS_W; mosaicLayerCanvas.height = CANVAS_H;
  }
  const mlCtx = mosaicLayerCanvas.getContext('2d');
  mlCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  if (!uploadedImg) { mosaicLayerDirty = false; return; }

  // Draw the photo at full res into a scratch canvas the same way it's
  // drawn on the main canvas, then shrink-and-blow-up through a tiny
  // intermediate canvas to get the blocky pixelated look.
  const srcCanvas = document.createElement('canvas');
  srcCanvas.width = CANVAS_W; srcCanvas.height = CANVAS_H;
  const srcCtx = srcCanvas.getContext('2d');
  drawImageWithTransform(srcCtx, uploadedImg, CANVAS_W, CANVAS_H);

  const smallW = Math.max(1, Math.round(CANVAS_W / MOSAIC_BLOCK));
  const smallH = Math.max(1, Math.round(CANVAS_H / MOSAIC_BLOCK));
  const tinyCanvas = document.createElement('canvas');
  tinyCanvas.width = smallW; tinyCanvas.height = smallH;
  const tinyCtx = tinyCanvas.getContext('2d');
  tinyCtx.imageSmoothingEnabled = true;
  tinyCtx.drawImage(srcCanvas, 0, 0, smallW, smallH);

  mlCtx.imageSmoothingEnabled = false;
  mlCtx.drawImage(tinyCanvas, 0, 0, smallW, smallH, 0, 0, CANVAS_W, CANVAS_H);
  mosaicLayerDirty = false;
}

// Composites the pixelated layer, masked to only the painted areas, onto
// the main canvas. Called from render(), right where the photo is drawn.
function drawMosaicComposite() {
  if (!uploadedImg || !maskCanvas) return;
  if (mosaicLayerDirty) rebuildMosaicLayer();
  compositeCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  compositeCtx.drawImage(mosaicLayerCanvas, 0, 0);
  compositeCtx.globalCompositeOperation = 'destination-in';
  compositeCtx.drawImage(maskCanvas, 0, 0);
  compositeCtx.globalCompositeOperation = 'source-over';
  ctx.drawImage(compositeCanvas, 0, 0);
}

function canvasPointFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = CANVAS_W / rect.width, scaleY = CANVAS_H / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

function paintSegment(from, to) {
  ensureMosaicCanvases();
  maskCtx.lineCap = 'round'; maskCtx.lineJoin = 'round';
  maskCtx.strokeStyle = '#fff'; maskCtx.fillStyle = '#fff';
  maskCtx.lineWidth = brushRadius * 2;
  maskCtx.beginPath();
  if (from) { maskCtx.moveTo(from.x, from.y); maskCtx.lineTo(to.x, to.y); maskCtx.stroke(); }
  maskCtx.beginPath(); maskCtx.arc(to.x, to.y, brushRadius, 0, Math.PI * 2); maskCtx.fill();
}

function updateMosaicButtons() {
  const hasImg = !!uploadedImg;
  mosaicToggleBtn.disabled = !hasImg;
  mosaicUndoBtn.disabled = !hasImg || undoStack.length === 0;
  mosaicClearBtn.disabled = !hasImg || undoStack.length === 0;
}

function startPaint(e) {
  if (!mosaicMode || !uploadedImg) return;
  ensureMosaicCanvases();
  e.preventDefault();
  // Snapshot the mask before this stroke so it can be undone as one step.
  undoStack.push(maskCtx.getImageData(0, 0, CANVAS_W, CANVAS_H));
  if (undoStack.length > 25) undoStack.shift();
  updateMosaicButtons();
  isPainting = true;
  const pt = canvasPointFromEvent(e);
  paintSegment(null, pt);
  lastPaintPt = pt;
  render();
}
function movePaint(e) {
  if (!isPainting) return;
  e.preventDefault();
  const pt = canvasPointFromEvent(e);
  paintSegment(lastPaintPt, pt);
  lastPaintPt = pt;
  render();
}
function endPaint() { isPainting = false; lastPaintPt = null; }

canvas.addEventListener('mousedown', startPaint);
canvas.addEventListener('mousemove', movePaint);
window.addEventListener('mouseup', endPaint);
canvas.addEventListener('touchstart', startPaint, { passive: false });
canvas.addEventListener('touchmove', movePaint, { passive: false });
canvas.addEventListener('touchend', endPaint);
canvas.addEventListener('touchcancel', endPaint);

brushSizeInput.addEventListener('input', () => {
  brushRadius = parseInt(brushSizeInput.value, 10);
  updateBrushCursor();
});

// Round cursor matching the current brush size, instead of the default
// browser crosshair (which renders as a plus sign).
function updateBrushCursor() {
  if (!mosaicMode) { canvas.style.cursor = 'default'; return; }
  const ds = getDisplayScale();
  const r = Math.max(5, Math.round(brushRadius * ds));
  const size = r * 2 + 4;
  const c = size / 2;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}'><circle cx='${c}' cy='${c}' r='${r - 1}' fill='rgba(232,65,44,.18)' stroke='#E8412C' stroke-width='2'/></svg>`;
  canvas.style.cursor = `url("data:image/svg+xml,${encodeURIComponent(svg)}") ${c} ${c}, crosshair`;
}
window.addEventListener('resize', () => { if (mosaicMode) updateBrushCursor(); });

mosaicToggleBtn.addEventListener('click', () => {
  mosaicMode = !mosaicMode;
  mosaicToggleBtn.classList.toggle('active', mosaicMode);
  photoOverlay.style.pointerEvents = mosaicMode ? 'none' : 'all';
  [handleNW, handleNE, handleSW, handleSE, resetPhotoBtn].forEach(el => {
    if (el) el.style.pointerEvents = mosaicMode ? 'none' : 'all';
  });
  updateBrushCursor();
});

mosaicUndoBtn.addEventListener('click', () => {
  if (undoStack.length === 0) return;
  const snapshot = undoStack.pop();
  ensureMosaicCanvases();
  maskCtx.putImageData(snapshot, 0, 0);
  updateMosaicButtons();
  render();
});

mosaicClearBtn.addEventListener('click', () => {
  if (!maskCtx) return;
  ensureMosaicCanvases();
  undoStack.push(maskCtx.getImageData(0, 0, CANVAS_W, CANVAS_H));
  maskCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  updateMosaicButtons();
  render();
});

// ===== MAIN RENDER =====
function render() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // ---- FOTO FULL BLEED ----
  let photoBounds = null;
  if (uploadedImg) {
    photoBounds = drawImageWithTransform(ctx, uploadedImg, CANVAS_W, CANVAS_H);
    drawMosaicComposite();
  } else {
    ctx.fillStyle = '#2A2A2A';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.fillStyle = '#555';
    ctx.font = '500 32px Inter, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Foto headline akan muncul di sini', CANVAS_W / 2, CANVAS_H / 2);
    ctx.textAlign = 'left';
  }

  // Titik teratas area kosong di bawah foto (kalau foto digeser/diperkecil sehingga tidak nutup penuh)
  const photoBottomFrac = photoBounds
    ? Math.min(1, Math.max(0, (photoBounds.drawY + photoBounds.drawH) / CANVAS_H))
    : 1;

  // ---- GRADIENT OVERLAY (bawah ke atas) ----
  const gradH = CANVAS_H * 0.68;
  const grad = ctx.createLinearGradient(0, CANVAS_H - gradH, 0, CANVAS_H);
  grad.addColorStop(0, 'rgba(255,255,255,0)');
  grad.addColorStop(0.35, 'rgba(255,255,255,0.55)');
  grad.addColorStop(1, 'rgba(255,255,255,0.92)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, CANVAS_H - gradH, CANVAS_W, gradH);

  // ---- GRADIENT PUTIH MANUAL (opsional, buat nutupin foto yang kurang bagus) ----
  if (extraGradientEnabled) {
    const t = extraGradientIntensity / 100; // 0 - 1
    const fixedAlpha = 1;
    const gap = 0.08; // zona transisi pendek

    // Batas atas (slider 0) dan batas bawah (slider 100) jangkauan gradien,
    // sudah mempertimbangkan batas foto asli supaya seam selalu ketutup DAN
    // slider tetap bergerak linear dari 0% (gak ada "dead zone" di awal).
    const capBottom = 0.95;
    const capTop = 0.20;
    const upperBound = Math.min(capBottom, photoBottomFrac);
    const lowerBound = Math.min(capTop, upperBound);
    const fullWhitePoint = upperBound - t * (upperBound - lowerBound);
    const transparentPoint = Math.max(0, fullWhitePoint - gap);
    const smoothstep = (x) => x * x * (3 - 2 * x);

    const extraGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
    extraGrad.addColorStop(0, 'rgba(255,255,255,0)');
    extraGrad.addColorStop(transparentPoint, 'rgba(255,255,255,0)');
    [0.25, 0.5, 0.75].forEach((s) => {
      const pos = transparentPoint + (fullWhitePoint - transparentPoint) * s;
      const a = fixedAlpha * smoothstep(s);
      extraGrad.addColorStop(pos, `rgba(255,255,255,${a.toFixed(3)})`);
    });
    extraGrad.addColorStop(fullWhitePoint, `rgba(255,255,255,${fixedAlpha})`);
    extraGrad.addColorStop(1, `rgba(255,255,255,${fixedAlpha})`);
    ctx.fillStyle = extraGrad;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  }

  // ---- LOGO (pojok kiri atas) ----
  if (logoLoaded) {
    const logoMaxW = 170;
    const ratio = logoImg.height / logoImg.width;
    ctx.drawImage(logoImg, 56, 48, logoMaxW, logoMaxW * ratio);
  }

  // ---- JUDUL dengan per-baris red background ----
  const headline = headlineInput.value.trim() || 'Judul headline berita akan tampil di sini';
  const padX = 72;
  const fontSize = 48;
  const maxTextWidth = CANVAS_W - padX * 2;
  const bgPadX = 22;
  const bgPadY = 12;
  const lineGap = 10;

  ctx.font = `700 ${fontSize}px Inter, Arial, sans-serif`;
  ctx.textAlign = 'left';
  const lines = wrapText(ctx, headline, maxTextWidth);
  const maxLines = 6;
  const shownLines = lines.slice(0, maxLines);
  if (lines.length > maxLines) {
    let lastLine = shownLines[maxLines - 1];
    while (ctx.measureText(lastLine + '...').width > maxTextWidth && lastLine.includes(' ')) {
      lastLine = lastLine.slice(0, lastLine.lastIndexOf(' '));
    }
    shownLines[maxLines - 1] = lastLine + '...';
  }

  const rowH = fontSize + bgPadY * 2;
  const totalTextBlockH = shownLines.length * rowH + (shownLines.length - 1) * lineGap;

  const domainFontSize = 26;
  const madeFontSize = 22;
  const domainMarginTop = 44;
  const madeMarginTop = 16;

  const totalBlockH = totalTextBlockH + domainMarginTop + domainFontSize + madeMarginTop + madeFontSize;
  const blockBottomPad = 96;
  const startY = CANVAS_H - blockBottomPad - totalBlockH;

  // Gambar setiap baris: kotak merah dulu, baru teks putih di atasnya
  shownLines.forEach((line, i) => {
    const textW = ctx.measureText(line).width;
    const boxX = padX - bgPadX;
    const boxY = startY + i * (rowH + lineGap);
    const boxW = textW + bgPadX * 2;
    const boxH = rowH;

    ctx.fillStyle = GREEN;
    ctx.fillRect(boxX, boxY, boxW, boxH);

    ctx.fillStyle = WHITE;
    ctx.fillText(line, padX, boxY + bgPadY + fontSize - 4);
  });
}

// ===== EVENT HANDLERS =====
headlineInput.addEventListener('input', () => {
  const len = headlineInput.value.length;
  charCount.textContent = `${len} / 160`;
  charCount.classList.toggle('warn', len > 140);
  render();
});

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    setStatus('File harus berupa gambar (JPG/PNG/WEBP)', 'error');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      uploadedImg = img;
      photoTransform = { x: 0, y: 0, scale: 1 };
      clearMosaicMask(); mosaicLayerDirty = true;
      dropzone.classList.add('has-image');
      previewThumb.innerHTML = '';
      const thumb = document.createElement('img');
      thumb.src = e.target.result;
      previewThumb.appendChild(thumb);
      downloadBtn.disabled = false;
      setStatus('Foto berhasil dimuat. Siap download.', 'success');
      render();
      updatePhotoOverlay();
    };
    img.onerror = () => setStatus('Gagal memuat gambar, coba file lain', 'error');
    img.src = e.target.result;
  };
  reader.onerror = () => setStatus('Gagal membaca file', 'error');
  reader.readAsDataURL(file);
}

fileInput.addEventListener('change', (e) => {
  if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
});

dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('dragover');
});
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

document.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (file) { handleFile(file); e.preventDefault(); }
      break;
    }
  }
});

removeImgBtn.addEventListener('click', () => {
  uploadedImg = null;
  fileInput.value = '';
  dropzone.classList.remove('has-image');
  previewThumb.innerHTML = '';
  downloadBtn.disabled = true;
  photoTransform = { x: 0, y: 0, scale: 1 };
  clearMosaicMask();
  mosaicMode = false; mosaicToggleBtn.classList.remove('active');
  photoOverlay.style.pointerEvents = 'all'; canvas.style.cursor = 'default';
  [handleNW, handleNE, handleSW, handleSE, resetPhotoBtn].forEach(el => {
    if (el) el.style.pointerEvents = 'all';
  });
  setStatus('Upload foto dulu buat mulai', '');
  updatePhotoOverlay();
  render();
});

// ===== PHOTO OVERLAY (drag + resize handles) =====
const canvasWrap = document.querySelector('.canvas-wrap');
const photoOverlay = document.getElementById('photoOverlay');
const handleNW = document.getElementById('hNW');
const handleNE = document.getElementById('hNE');
const handleSW = document.getElementById('hSW');
const handleSE = document.getElementById('hSE');
const resetPhotoBtn = document.getElementById('resetPhotoBtn');

// canvas display scale (preview vs actual 1080x1350)
function getDisplayScale() {
  return canvas.offsetWidth / CANVAS_W;
}

function updatePhotoOverlay() {
  if (!uploadedImg) {
    photoOverlay.style.display = 'none';
    resetPhotoBtn.style.display = 'none';
    return;
  }
  resetPhotoBtn.style.display = 'block';

  const ds = getDisplayScale();

  // Compute displayed image bounds in preview coords
  const imgRatio = uploadedImg.width / uploadedImg.height;
  const boxRatio = CANVAS_W / CANVAS_H;
  let baseW, baseH;
  if (imgRatio > boxRatio) {
    baseH = CANVAS_H;
    baseW = baseH * imgRatio;
  } else {
    baseW = CANVAS_W;
    baseH = baseW / imgRatio;
  }

  const drawW = (baseW * photoTransform.scale) * ds;
  const drawH = (baseH * photoTransform.scale) * ds;
  const drawX = ((CANVAS_W - baseW * photoTransform.scale) / 2 + photoTransform.x) * ds;
  const drawY = ((CANVAS_H - baseH * photoTransform.scale) / 2 + photoTransform.y) * ds;

  photoOverlay.style.display = 'block';
  photoOverlay.style.left = drawX + 'px';
  photoOverlay.style.top = drawY + 'px';
  photoOverlay.style.width = drawW + 'px';
  photoOverlay.style.height = drawH + 'px';
}

// ---- DRAG photo to pan ----
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let transformAtDragStart = { x: 0, y: 0 };

photoOverlay.addEventListener('mousedown', (e) => {
  if (e.target !== photoOverlay) return; // ignore handle clicks
  isDragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  transformAtDragStart = { x: photoTransform.x, y: photoTransform.y };
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging && !activeHandle) return;

  const ds = getDisplayScale();

  if (isDragging) {
    const dx = (e.clientX - dragStart.x) / ds;
    const dy = (e.clientY - dragStart.y) / ds;
    photoTransform.x = transformAtDragStart.x + dx;
    photoTransform.y = transformAtDragStart.y + dy;
    updatePhotoOverlay();
    render();
  }

  if (activeHandle) {
    handleResizeMove(e);
  }
});

document.addEventListener('mouseup', () => {
  if (isDragging || activeHandle) mosaicLayerDirty = true;
  isDragging = false;
  activeHandle = null;
});

// ---- RESIZE HANDLES ----
let activeHandle = null;
let resizeStart = { mouseX: 0, mouseY: 0, scale: 1, tx: 0, ty: 0 };

function startResize(e, corner) {
  activeHandle = corner;
  resizeStart = {
    mouseX: e.clientX,
    mouseY: e.clientY,
    scale: photoTransform.scale,
    tx: photoTransform.x,
    ty: photoTransform.y
  };
  e.preventDefault();
  e.stopPropagation();
}

function handleResizeMove(e) {
  const ds = getDisplayScale();
  const dx = (e.clientX - resizeStart.mouseX) / ds;
  const dy = (e.clientY - resizeStart.mouseY) / ds;

  // Compute delta based on corner being dragged
  let delta = 0;
  if (activeHandle === 'SE') delta = (dx + dy) / 2;
  if (activeHandle === 'NW') delta = -(dx + dy) / 2;
  if (activeHandle === 'NE') delta = (dx - dy) / 2;
  if (activeHandle === 'SW') delta = (-dx + dy) / 2;

  // Scale relative to current image size
  const imgRatio = uploadedImg.width / uploadedImg.height;
  const boxRatio = CANVAS_W / CANVAS_H;
  let baseW;
  if (imgRatio > boxRatio) {
    baseW = CANVAS_H * imgRatio;
  } else {
    baseW = CANVAS_W;
  }

  const newScale = Math.max(0.3, Math.min(5, resizeStart.scale + delta / baseW));
  photoTransform.scale = newScale;
  render();
  updatePhotoOverlay();
}

handleNW.addEventListener('mousedown', (e) => startResize(e, 'NW'));
handleNE.addEventListener('mousedown', (e) => startResize(e, 'NE'));
handleSW.addEventListener('mousedown', (e) => startResize(e, 'SW'));
handleSE.addEventListener('mousedown', (e) => startResize(e, 'SE'));

// Touch support
photoOverlay.addEventListener('touchstart', (e) => {
  if (e.target !== photoOverlay) return;
  const t = e.touches[0];
  isDragging = true;
  dragStart = { x: t.clientX, y: t.clientY };
  transformAtDragStart = { x: photoTransform.x, y: photoTransform.y };
  e.preventDefault();
}, { passive: false });

document.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  const t = e.touches[0];
  const ds = getDisplayScale();
  photoTransform.x = transformAtDragStart.x + (t.clientX - dragStart.x) / ds;
  photoTransform.y = transformAtDragStart.y + (t.clientY - dragStart.y) / ds;
  updatePhotoOverlay();
  render();
  e.preventDefault();
}, { passive: false });

document.addEventListener('touchend', () => {
  if (isDragging) mosaicLayerDirty = true;
  isDragging = false;
});

resetPhotoBtn.addEventListener('click', resetPhotoTransform);

// update overlay on window resize
window.addEventListener('resize', updatePhotoOverlay);

downloadBtn.addEventListener('click', () => {
  try {
    const link = document.createElement('a');
    const safeTitle = (headlineInput.value.trim() || 'konten-berita')
      .toLowerCase().replace(/[^a-z0-9\s]/g, '').trim().replace(/\s+/g, '-').slice(0, 50);
    link.download = `bali-express-highlight-${safeTitle || 'konten'}.jpg`;
    link.href = canvas.toDataURL('image/jpeg', 0.92);
    link.click();
    setStatus('Berhasil di-download!', 'success');
  } catch (err) {
    setStatus('Gagal export gambar, coba lagi', 'error');
  }
});

function setStatus(msg, type) {
  statusMsg.textContent = msg;
  statusMsg.className = 'status-msg' + (type ? ' ' + type : '');
}

// ===== SUPPORT DEVELOPER MODAL =====
const supportBtn = document.getElementById('supportBtn');
const supportModal = document.getElementById('supportModal');
const modalClose = document.getElementById('modalClose');
const copyBtn = document.getElementById('copyBtn');
const bankNumber = document.getElementById('bankNumber');

supportBtn.addEventListener('click', () => supportModal.classList.add('open'));

function closeModal() { supportModal.classList.remove('open'); }
modalClose.addEventListener('click', closeModal);
supportModal.addEventListener('click', (e) => { if (e.target === supportModal) closeModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && supportModal.classList.contains('open')) closeModal();
});

copyBtn.addEventListener('click', async () => {
  const number = bankNumber.textContent.trim();
  try {
    await navigator.clipboard.writeText(number);
  } catch {
    const temp = document.createElement('textarea');
    temp.value = number;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand('copy');
    document.body.removeChild(temp);
  }
  copyBtn.textContent = 'Tersalin ✓';
  copyBtn.classList.add('copied');
  setTimeout(() => {
    copyBtn.textContent = 'Copy Nomor Rekening';
    copyBtn.classList.remove('copied');
  }, 1800);
});

// ===== FONT LOADING =====
function waitForFont() {
  if (document.fonts && document.fonts.load) {
    return Promise.all([
      document.fonts.load('700 48px Inter'),
      document.fonts.load('300 26px Poppins')
    ]).catch(() => {}).then(() => document.fonts.ready);
  }
  return Promise.resolve();
}

waitForFont().then(render);
render();

</script>
