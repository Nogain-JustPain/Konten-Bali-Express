<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Konten — Bali Express (Kotak)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Poppins:wght@400;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --be-red: #ff6d6d;
    --ink: #15141A;
    --ink-soft: #4A4854;
    --paper: #FAFAF8;
    --line: #E5E2DC;
    --panel: #FFFFFF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  .app {
    display: grid;
    grid-template-columns: 380px 1fr;
    min-height: 100vh;
  }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 28px 26px 40px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--ink);
  }

  .brand-mark {
    width: 10px;
    height: 28px;
    background: var(--be-red);
    flex-shrink: 0;
  }

  .brand-row h1 {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.01em;
    margin: 0;
    line-height: 1.2;
  }

  .brand-row span {
    display: block;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 2px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .field label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }

  textarea {
    width: 100%;
    border: 1.5px solid var(--line);
    border-radius: 6px;
    padding: 12px 13px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: var(--paper);
    resize: vertical;
    min-height: 160px;
    line-height: 1.4;
    transition: border-color 0.15s ease;
  }

  textarea:focus {
    outline: none;
    border-color: var(--be-red);
  }

  .char-count {
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
  }

  .char-count.warn { color: var(--be-red); font-weight: 700; }

  .download-btn {
    margin-top: 6px;
    width: 100%;
    padding: 15px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .download-btn:hover { background: #e65656; }
  .download-btn:active { transform: scale(0.98); }

  .status-msg {
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    min-height: 16px;
  }

  .status-msg.error { color: var(--be-red); font-weight: 600; }
  .status-msg.success { color: #1a7a3c; font-weight: 600; }

  .support-btn {
    margin-top: 4px;
    width: 100%;
    padding: 11px;
    background: transparent;
    color: var(--ink-soft);
    border: 1.5px dashed var(--line);
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .support-btn:hover {
    border-color: var(--be-red);
    color: #e65656;
    background: #FFF5F3;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(21, 20, 26, 0.55);
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal-box {
    background: var(--panel);
    border-radius: 14px;
    padding: 28px 26px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: none;
    border: none;
    font-size: 18px;
    color: var(--ink-soft);
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }

  .modal-close:hover { color: var(--ink); }

  .modal-icon { font-size: 30px; margin-bottom: 10px; }

  .modal-box h3 { margin: 0 0 6px; font-size: 16px; font-weight: 800; }

  .modal-box p {
    margin: 0 0 18px;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.4;
  }

  .bank-card {
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    text-align: left;
  }

  .bank-card .bank-name {
    font-size: 12px;
    font-weight: 700;
    color: var(--be-red);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .bank-card .bank-number {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
    font-family: 'SF Mono', Consolas, monospace;
  }

  .bank-card .bank-owner {
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .copy-btn {
    margin-top: 14px;
    width: 100%;
    padding: 11px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .copy-btn:hover { background: #e65656; }
  .copy-btn.copied { background: #1a7a3c; }

  .preview-area {
    background: #EFEDE7;
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    justify-content: center;
    padding: 40px;
    overflow: auto;
    gap: 20px;
  }

  .canvas-wrap {
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
    border-radius: 4px;
    overflow: visible !important;
    max-width: 100%;
    position: relative;
  }

  #canvas {
    display: block;
    width: 360px;
    height: 450px;
    background: #FFFFFF;
    border-radius: 4px;
  }

  .loading-screen { position:fixed; inset:0; z-index:9999; background:#FBFAF5; display:flex; align-items:center; justify-content:center; transition:opacity .5s ease, visibility .5s ease; }
  .loading-screen.hide { opacity:0; visibility:hidden; pointer-events:none; }
  .loading-text { font-family:'Playfair Display', Georgia, serif; font-weight:500; font-style:italic; font-size:34px; color:#3A3833; letter-spacing:.02em; opacity:0; transition:opacity .7s ease; text-align:center; padding:0 24px; }
  .loading-text.show { opacity:1; }
  @media(max-width:900px){.loading-text{font-size:26px}}

  @media (max-width: 900px) {
    .preview-area { padding: 24px 16px; flex-direction: column; align-items: center; }
    #canvas { width: 300px; height: 375px; }
  }
</style>
</head>
<body>
<div class="loading-screen" id="loadingScreen">
  <div class="loading-text" id="loadingText"></div>
</div>
<div class="app">

  <div class="panel">
    <div class="brand-row">
      <div class="brand-mark"></div>
      <div>
        <h1>Generator Konten</h1>
        <span>Bali Express — Tanya Tanya</span>
      </div>
    </div>

    <div class="field">
      <label for="headline">Judul Headline</label>
      <textarea id="headline" placeholder="Tulis judul berita di sini..." maxlength="160"></textarea>
      <div class="char-count" id="charCount">0 / 160</div>
    </div>

    <button class="download-btn" id="downloadBtn">
      ⬇ Download JPG
    </button>
    <div class="status-msg" id="statusMsg">Siap download</div>

    <button class="support-btn" id="supportBtn">☕ Support Developer</button>
  </div>

  <div class="preview-area">
    <div class="canvas-wrap">
      <canvas id="canvas" width="1080" height="1350"></canvas>
    </div>
  </div>

</div>

<div class="modal-overlay" id="supportModal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-icon">☕</div>
    <h3>Support Developer</h3>
    <p>Kalau tools ini membantu kerjaan lu, boleh banget traktir kopi buat developernya 🙏</p>
    <div class="bank-card">
      <div class="bank-name">BCA</div>
      <div class="bank-number" id="bankNumber">1800994850</div>
      <div class="bank-owner">a.n. MOCH IQBAL KURNIAWAN</div>
    </div>
    <button class="copy-btn" id="copyBtn">Copy Nomor Rekening</button>
  </div>
</div>

// Recolor an image to solid black, keeping its alpha shape (used for sosmed icons
// so they always come out black regardless of the original icon's brand colors).
function tintImageBlack(img) {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || img.width;
  c.height = img.naturalHeight || img.height;
  const cctx = c.getContext('2d');
  cctx.drawImage(img, 0, 0);
  cctx.globalCompositeOperation = 'source-in';
  cctx.fillStyle = '#111111';
  cctx.fillRect(0, 0, c.width, c.height);
  return c;
}

// ===== ICON SOSMED (TikTok, Facebook, Instagram) =====
const socialIcons = [
  { img: new Image(), b64: ICON_TIKTOK_B64, loaded: false, tinted: null },
  { img: new Image(), b64: ICON_FB_B64, loaded: false, tinted: null },
  { img: new Image(), b64: ICON_IG_B64, loaded: false, tinted: null },
];
socialIcons.forEach((icon) => {
  icon.img.onload = () => {
    icon.tinted = tintImageBlack(icon.img);
    icon.loaded = true;
    render();
  };
  icon.img.src = 'data:image/png;base64,' + icon.b64;
});

// ===== HELPERS =====
function wrapText(context, text, maxWidth) {
  const paragraphs = text.split('\n');
  const lines = [];
  for (const paragraph of paragraphs) {
    if (paragraph === '') { lines.push(''); continue; }
    const words = paragraph.split(' ');
    let current = '';
    for (const word of words) {
      const test = current ? current + ' ' + word : word;
      if (context.measureText(test).width > maxWidth && current) {
        lines.push(current);
        current = word;
      } else {
        current = test;
      }
    }
    if (current) lines.push(current);
  }
  return lines;
}

// Layout: headline dihitung dulu supaya kita tau berapa baris & tinggi blok teksnya,
// lalu blok itu di-anchor persis di TENGAH kanvas (vertikal), jadi kalau teksnya
// makin panjang (makin banyak baris), blok teksnya melebar simetris ke atas & ke bawah
// dari titik tengah, bukan cuma ke bawah.
function computeLayout() {
  const raw = headlineInput.value.trim() || 'Judul headline berita akan tampil di sini';
  const headline = raw.toUpperCase();

  const padX = 140;       // margin kiri-kanan teks headline
  const fontSize = 58;
  const lineHeight = 78;
  const maxTextWidth = CANVAS_W - padX * 2;

  ctx.font = `800 ${fontSize}px Inter, Arial, sans-serif`;
  const lines = wrapText(ctx, headline, maxTextWidth);
  const maxLines = 8;
  const shownLines = lines.slice(0, maxLines);
  if (lines.length > maxLines) {
    let lastLine = shownLines[maxLines - 1];
    while (ctx.measureText(lastLine + '...').width > maxTextWidth && lastLine.includes(' ')) {
      lastLine = lastLine.slice(0, lastLine.lastIndexOf(' '));
    }
    shownLines[maxLines - 1] = lastLine + '...';
  }

  const textH = shownLines.length * lineHeight;
  const centerY = CANVAS_H / 2;
  const startY = centerY - textH / 2;

  return { padX, fontSize, lineHeight, shownLines, startY };
}

function drawBorder() {
  ctx.save();
  ctx.strokeStyle = STROKE_COLOR;
  ctx.lineWidth = STROKE_WIDTH;
  ctx.strokeRect(STROKE_WIDTH / 2, STROKE_WIDTH / 2, CANVAS_W - STROKE_WIDTH, CANVAS_H - STROKE_WIDTH);
  ctx.restore();
}

function drawLogos() {
  const padX = 72, padY = 48;
  if (logoLoaded) {
    const ratio = logoImg.height / logoImg.width;
    const w = 240, h = 240 * ratio;
    ctx.drawImage(logoImg, padX, padY, w, h);
  }
  if (tanyaLoaded) {
    const ratio = tanyaImg.height / tanyaImg.width;
    const w = 170, h = 170 * ratio;
    ctx.drawImage(tanyaImg, CANVAS_W - padX - w, padY - 14, w, h);
  }
}

function drawHeadline(layout) {
  const { padX, fontSize, lineHeight, shownLines, startY } = layout;
  ctx.font = `800 ${fontSize}px Inter, Arial, sans-serif`;
  ctx.fillStyle = INK;
  ctx.textAlign = 'left';
  shownLines.forEach((line, i) => {
    ctx.fillText(line, padX, startY + i * lineHeight + fontSize * 0.86);
  });
}

function drawFooter() {
  const padX = 72;
  const rowCenterY = CANVAS_H - 72;
  const iconSize = 26, iconGap = 10, iconTextGap = 12;
  const iconY = rowCenterY - iconSize / 2;

  let iconCursorX = padX;
  const loadedIcons = socialIcons.filter((ic) => ic.loaded);
  loadedIcons.forEach((icon) => {
    const ratio = icon.img.width / icon.img.height;
    const drawH = iconSize;
    const drawW = drawH * ratio;
    ctx.drawImage(icon.tinted, iconCursorX, iconY, drawW, drawH);
    iconCursorX += drawW + iconGap;
  });

  const brandTextX = loadedIcons.length ? iconCursorX + iconTextGap : padX;
  const textBaselineY = rowCenterY + 9;

  ctx.font = `400 26px Poppins, Arial, sans-serif`;
  ctx.fillStyle = INK;
  ctx.textAlign = 'left';
  ctx.fillText('koranbaliexpress', brandTextX, textBaselineY);

  ctx.font = `400 26px Poppins, Arial, sans-serif`;
  ctx.fillStyle = INK;
  ctx.textAlign = 'right';
  ctx.fillText('baliexpress.id', CANVAS_W - padX, textBaselineY);
  ctx.textAlign = 'left';
}

// ===== MAIN RENDER =====
function render() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  ctx.fillStyle = WHITE;
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  const layout = computeLayout();
  drawHeadline(layout);
  drawLogos();
  drawFooter();
  drawBorder();
}

// ===== EVENT HANDLERS =====
headlineInput.addEventListener('input', () => {
  const len = headlineInput.value.length;
  charCount.textContent = `${len} / 160`;
  charCount.classList.toggle('warn', len > 140);
  render();
});

downloadBtn.addEventListener('click', () => {
  try {
    const link = document.createElement('a');
    const safeTitle = (headlineInput.value.trim() || 'konten-berita')
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, '')
      .trim()
      .replace(/\s+/g, '-')
      .slice(0, 50);
    link.download = `bali-express-kotak-${safeTitle || 'konten'}.jpg`;
    link.href = canvas.toDataURL('image/jpeg', 0.95);
    link.click();
    setStatus('Berhasil di-download!', 'success');
  } catch (err) {
    setStatus('Gagal export gambar, coba lagi', 'error');
  }
});

function setStatus(msg, type) {
  statusMsg.textContent = msg;
  statusMsg.className = 'status-msg' + (type ? ' ' + type : '');
}

// ===== SUPPORT DEVELOPER MODAL =====
const supportBtn = document.getElementById('supportBtn');
const supportModal = document.getElementById('supportModal');
const modalClose = document.getElementById('modalClose');
const copyBtn = document.getElementById('copyBtn');
const bankNumber = document.getElementById('bankNumber');

supportBtn.addEventListener('click', () => {
  supportModal.classList.add('open');
});

function closeModal() {
  supportModal.classList.remove('open');
}

modalClose.addEventListener('click', closeModal);
supportModal.addEventListener('click', (e) => {
  if (e.target === supportModal) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && supportModal.classList.contains('open')) closeModal();
});

copyBtn.addEventListener('click', async () => {
  const number = bankNumber.textContent.trim();
  try {
    await navigator.clipboard.writeText(number);
    copyBtn.textContent = 'Tersalin ✓';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = 'Copy Nomor Rekening';
      copyBtn.classList.remove('copied');
    }, 1800);
  } catch (err) {
    const temp = document.createElement('textarea');
    temp.value = number;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand('copy');
    document.body.removeChild(temp);
    copyBtn.textContent = 'Tersalin ✓';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = 'Copy Nomor Rekening';
      copyBtn.classList.remove('copied');
    }, 1800);
  }
});

// ===== LOADING SCREEN =====
const LOADING_TEXTS = ['Semangat!', '화이팅!', '頑張って！', 'Forza!', 'Bon courage !', "Let's Go!"];
const LOADING_BAG_KEY = 'be_loading_bag_kotak_v2';

function shuffledCopy(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function nextLoadingTextPersisted() {
  let bag = [];
  try { bag = JSON.parse(localStorage.getItem(LOADING_BAG_KEY) || '[]'); } catch (e) { bag = []; }
  if (!Array.isArray(bag) || bag.length === 0) bag = shuffledCopy(LOADING_TEXTS);

  const word = bag.pop();
  try { localStorage.setItem(LOADING_BAG_KEY, JSON.stringify(bag)); } catch (e) { /* storage unavailable, ignore */ }
  return word;
}

const loadingScreen = document.getElementById('loadingScreen');
const loadingTextEl = document.getElementById('loadingText');

loadingTextEl.textContent = nextLoadingTextPersisted();
requestAnimationFrame(() => loadingTextEl.classList.add('show'));

const LOADING_MIN_MS = 1100;
const loadingStartedAt = Date.now();
function hideLoadingScreen() {
  const wait = Math.max(0, LOADING_MIN_MS - (Date.now() - loadingStartedAt));
  setTimeout(() => {
    loadingScreen.classList.add('hide');
  }, wait);
}

// ===== FONT LOADING =====
function waitForFont() {
  if (document.fonts && document.fonts.load) {
    return Promise.all([
      document.fonts.load('800 58px Inter'),
      document.fonts.load('400 26px Poppins'),
      document.fonts.load('italic 500 34px "Playfair Display"')
    ]).catch(() => {}).then(() => document.fonts.ready);
  }
  return Promise.resolve();
}

// initial render
waitForFont().then(() => { render(); hideLoadingScreen(); });
render();

</script>
