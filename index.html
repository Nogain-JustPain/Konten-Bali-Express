<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Konten — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #15141A; --ink-soft: #4A4854; --paper: #FAFAF8; --line: #E5E2DC; --card-dark: #1C1B20;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Poppins', sans-serif; -webkit-font-smoothing: antialiased;
  }

  .page-title {
    text-align: center; padding: 56px 24px 0;
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500;
    font-size: clamp(36px, 5vw, 48px); letter-spacing: -.01em; margin: 0;
  }
  .page-subtitle {
    text-align: center; font-size: 13.5px; color: var(--ink-soft); margin: 6px 0 54px;
  }

  .wrap { max-width: 900px; margin: 0 auto; padding: 0 24px 90px; }

  .page-section { margin-bottom: 58px; }
  .page-section:last-child { margin-bottom: 0; }

  .section-head {
    display: flex; align-items: center; justify-content: flex-start; gap: 18px; margin-bottom: 26px;
  }
  .section-head h2 {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500;
    font-size: 21px; margin: 0; white-space: nowrap;
  }
  .section-head .rule { flex: 1; max-width: 220px; height: 1px; background: var(--ink); opacity: .35; }

  .card-row {
    display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 18px;
  }

  .card {
    width: 158px; aspect-ratio: 3/4; border-radius: 22px; overflow: hidden; position: relative;
    text-decoration: none; display: flex; align-items: flex-end; justify-content: center;
    background: var(--card-dark); transition: transform .18s ease, box-shadow .18s ease;
  }
  .card.available:hover { transform: translateY(-5px); box-shadow: 0 14px 28px rgba(21,20,26,.22); }
  .card.soon { opacity: .55; cursor: default; }

  .card-label {
    position: relative; z-index: 2; width: 100%; text-align: center; padding: 16px 10px;
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500; font-size: 13.5px;
    color: #fff; background: linear-gradient(to top, rgba(0,0,0,.55), transparent);
  }
  .card.soon .card-label { color: rgba(255,255,255,.75); }

  .card-preview { position: absolute; inset: 0; overflow: hidden; }
  .card-preview iframe { position:absolute; top:0; left:0; border:none; transform-origin: top left; pointer-events:none; background:#fff; }

  .card.soon .card-icon {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    width: 26px; height: 26px; color: rgba(255,255,255,.4);
  }

  @media (max-width: 600px) {
    .page-title { padding: 42px 20px 6px; }
    .page-subtitle { margin-bottom: 40px; }
    .card { width: 130px; }
    .section-head .rule { max-width: 100px; }
  }
</style>
</head>
<body>

  <h1 class="page-title">Generator Konten</h1>
  <p class="page-subtitle">Pilih template untuk mulai bikin konten</p>

  <div class="wrap" id="sections"></div>

<script>
  const BASE_WIDTH = 1280; // assumed natural width of live template pages, for preview scaling

  const PAGES = [
    {
      name: 'Bali Express',
      templates: [
        { name: 'Highlight', href: 'templates/bali-express/highlight/index.html', available: true },
        { name: 'Template', href: 'templates/bali-express/template-2/index.html', available: false },
        { name: 'Template', href: 'templates/bali-express/template-3/index.html', available: false },
        { name: 'Template', href: 'templates/bali-express/template-4/index.html', available: false },
      ]
    },
    {
      name: 'Info Bali',
      templates: [
        { name: 'Template', href: 'templates/info-bali/template-1/index.html', available: false },
        { name: 'Template', href: 'templates/info-bali/template-2/index.html', available: false },
        { name: 'Template', href: 'templates/info-bali/template-3/index.html', available: false },
      ]
    },
    {
      name: 'Cerita Bali',
      templates: [
        { name: 'Template', href: 'templates/cerita-bali/template-1/index.html', available: false },
        { name: 'Template', href: 'templates/cerita-bali/template-2/index.html', available: false },
        { name: 'Template', href: 'templates/cerita-bali/template-3/index.html', available: false },
      ]
    },
    {
      name: 'Info BWI',
      templates: [
        { name: 'Template', href: 'templates/info-bwi/template-1/index.html', available: false },
        { name: 'Template', href: 'templates/info-bwi/template-2/index.html', available: false },
        { name: 'Template', href: 'templates/info-bwi/template-3/index.html', available: false },
      ]
    },
  ];

  const lockIcon = '<svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

  const sectionsEl = document.getElementById('sections');

  PAGES.forEach(page => {
    const section = document.createElement('div');
    section.className = 'page-section';

    const row = page.templates.map(t => {
      const inner = t.available
        ? `<div class="card-preview"><iframe src="${t.href}" tabindex="-1" scrolling="no"></iframe></div><span class="card-label">${t.name}</span>`
        : `${lockIcon}<span class="card-label">${t.name}</span>`;
      return `<a class="card ${t.available ? 'available' : 'soon'}" href="${t.href}">${inner}</a>`;
    }).join('');

    section.innerHTML = `
      <div class="section-head"><h2>${page.name}</h2><span class="rule"></span></div>
      <div class="card-row">${row}</div>
    `;
    sectionsEl.appendChild(section);
  });

  // Scale every live iframe preview to fit its card, and keep it correct on resize.
  function scalePreview(wrapper) {
    const iframe = wrapper.querySelector('iframe');
    if (!iframe) return;
    const w = wrapper.clientWidth, h = wrapper.clientHeight;
    if (!w || !h) return;
    const scale = w / BASE_WIDTH;
    iframe.style.width = BASE_WIDTH + 'px';
    iframe.style.height = (h / scale) + 'px';
    iframe.style.transform = `scale(${scale})`;
  }
  function initPreviews() {
    const wrappers = document.querySelectorAll('.card-preview');
    wrappers.forEach(scalePreview);
    if ('ResizeObserver' in window) {
      const ro = new ResizeObserver(entries => entries.forEach(e => scalePreview(e.target)));
      wrappers.forEach(w => ro.observe(w));
    } else {
      window.addEventListener('resize', () => wrappers.forEach(scalePreview));
    }
  }
  initPreviews();
</script>

</body>
</html>
