<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Konten — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Inter:wght@600;700;800&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #15141A; --ink-soft: #4A4854; --paper: #FAFAF8; --line: #E5E2DC; --card-bg: #EFEDE7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Poppins', sans-serif; -webkit-font-smoothing: antialiased;
  }

  /* ===== HEADER: big elegant title, subtitle mepet di bawahnya ===== */
  .page-title {
    text-align: center; margin: 0; padding: 64px 24px 0;
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 400;
    font-size: clamp(38px, 5.4vw, 54px); letter-spacing: -.01em; line-height: 1.1;
  }
  .page-subtitle {
    text-align: center; font-size: 13.5px; color: var(--ink-soft); margin: 6px 0 56px;
  }

  .wrap { max-width: 960px; margin: 0 auto; padding: 0 48px 100px; }

  .page-section { margin-bottom: 54px; }
  .page-section:last-child { margin-bottom: 0; }

  /* ===== SECTION TAG: rata kiri, font beda dari judul utama (bukan italic) ===== */
  .section-head {
    display: flex; align-items: center; gap: 16px; margin-bottom: 22px;
  }
  .section-head h2 {
    font-family: 'Inter', sans-serif; font-weight: 800; font-size: 13.5px;
    text-transform: uppercase; letter-spacing: .12em; margin: 0; white-space: nowrap; color: var(--ink);
  }
  .section-head .rule { flex: 1; max-width: 200px; height: 1px; background: var(--ink); opacity: .3; }

  .card-row {
    display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 20px;
  }

  /* ===== CARD: thumbnail statis (JPEG 1080x1350, contain biar gak kepotong) + tombol Pakai di bawah ===== */
  a.card, .card { width: 160px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: inherit; }

  .card-thumb {
    width: 100%; aspect-ratio: 1080/1350; border-radius: 16px; overflow: hidden;
    background: var(--card-bg); position: relative; border: 1px solid var(--line);
    transition: border-color .18s ease;
  }
  a.card:hover .card-thumb { border-color: var(--ink); }
  .card-thumb img {
    width: 100%; height: 100%; object-fit: contain; display: block;
  }
  .card.soon .card-thumb {
    display: flex; align-items: center; justify-content: center;
    background-image: repeating-linear-gradient(135deg, rgba(21,20,26,.05) 0 10px, transparent 10px 20px);
  }
  .card.soon .card-thumb svg { width: 26px; height: 26px; color: var(--ink-soft); opacity: .35; }

  /* -- "Pakai" itu bagian dari <a> yang sama (bukan link terpisah), biar klik-kanan
     "open in new tab" tetap jalan di manapun card-nya diklik, bukan cuma di tombolnya -- */
  .card-cta {
    display: block; text-align: center;
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500; font-size: 13.5px;
    color: #fff; background: var(--ink); border-radius: 999px; padding: 9px 0;
    transition: background .18s ease, transform .18s ease;
  }
  a.card:hover .card-cta { background: #3A3833; transform: translateY(-2px); }

  .card-cta-soon {
    display: block; text-align: center; font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 11.5px;
    color: var(--ink-soft); opacity: .65; border-radius: 999px; padding: 9px 0; border: 1px solid var(--line);
  }

  @media (max-width: 600px) {
    .page-title { padding: 48px 20px 0; }
    .page-subtitle { margin: 6px 0 42px; }
    .card { width: 130px; }
    .section-head .rule { max-width: 90px; }
  }
</style>
</head>
<body>

  <h1 class="page-title">Generator Konten</h1>
  <p class="page-subtitle">Pilih template untuk mulai bikin konten</p>

  <div class="wrap" id="sections"></div>

<script>
  // Tiap template yang udah TERSEDIA butuh gambar thumbnail JPEG (1080x1350) ditaro di
  // assets/thumbnails/ dengan nama file sesuai "thumb" di bawah ini. Kalau gambarnya belum
  // ada / gagal dimuat, kotaknya otomatis fallback jadi warna polos (gak nampilin ikon rusak).
  const PAGES = [
    {
      name: 'Bali Express',
      templates: [
        { name: 'Template 1', href: 'templates/bali-express/Template-1/index.html', thumb: 'templates/bali-express/Template-1/bali-express-template-1.jpg', available: true },
        { name: 'Template 2', href: 'templates/bali-express/Template-2/index.html', thumb: 'templates/bali-express/Template-2/bali-express-template-2.jpg', available: true },
        { name: 'Template 3', href: 'templates/bali-express/Template-3/index.html', thumb: 'templates/bali-express/Template-3/bali-express-template-3.jpg', available: true },
        
      ]
    },
    {
      name: 'Info Bali',
      templates: [
        { name: 'Template', href: 'templates/info-bali/template-1/index.html', available: false },
        { name: 'Template', href: 'templates/info-bali/template-2/index.html', available: false },
        { name: 'Template', href: 'templates/info-bali/template-3/index.html', available: false },
      ]
    },
    {
      name: 'Cerita Bali',
      templates: [
        { name: 'Template', href: 'templates/cerita-bali/template-1/index.html', available: false },
        { name: 'Template', href: 'templates/cerita-bali/template-2/index.html', available: false },
        { name: 'Template', href: 'templates/cerita-bali/template-3/index.html', available: false },
      ]
    },
    {
      name: 'Info BWI',
      templates: [
        { name: 'Template', href: 'templates/info-bwi/template-1/index.html', available: false },
        { name: 'Template', href: 'templates/info-bwi/template-2/index.html', available: false },
        { name: 'Template', href: 'templates/info-bwi/template-3/index.html', available: false },
      ]
    },
  ];

  const lockIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

  const sectionsEl = document.getElementById('sections');

  PAGES.forEach(page => {
    const section = document.createElement('div');
    section.className = 'page-section';

    const row = page.templates.map(t => {
      const thumb = t.available
        ? `<div class="card-thumb"><img src="${t.thumb}" alt="${t.name}" loading="lazy" onerror="this.style.display='none'"></div>`
        : `<div class="card-thumb">${lockIcon}</div>`;
      const cta = t.available
        ? `<span class="card-cta">Pakai</span>`
        : `<span class="card-cta-soon">Segera Hadir</span>`;
      const tag = t.available ? 'a' : 'div';
      const hrefAttr = t.available ? ` href="${t.href}"` : '';
      return `<${tag} class="card ${t.available ? 'available' : 'soon'}"${hrefAttr}>${thumb}${cta}</${tag}>`;
    }).join('');

    section.innerHTML = `
      <div class="section-head"><h2>${page.name}</h2><span class="rule"></span></div>
      <div class="card-row">${row}</div>
    `;
    sectionsEl.appendChild(section);
  });
</script>

</body>
</html>
